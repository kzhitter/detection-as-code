[rule]
author = ["KZW"]
description = """ using sysmon data, we are triggering on Powershell logs where iwr or invoke-webrequest and .bat strings are observed """
from = "now-10m" 
name = "Powershell Invoke-WebRequest or iwr downloading a .bat file"
risk_score = 25
severity = "low"
type = "query"
rule_id = "00000000-0000-0000-0000-000000000007"

query = '''
event.dataset: "windows.sysmon_operational" and process.parent.name:powershell.exe and process.parent.command_line.text : (*Invoke-WebRequest* OR *iwr*) and process.command_line: *.bat*
'''

[rule.alert_suppression]
group_by = ["host.name"]
duration = {value = 5, unit = "m"}
missing_fields_strategy = "suppress"

[[rule.threat]] 
framework = "MITRE ATT&CK"

[[rule.threat.technique]]
id = "T1059"
name = "Command and Scripting Interpreter"
reference = "https://attack.mitre.org/techniques/T1059/"

[[rule.threat.technique.subtechnique]]
id = "T1059.001"
name = "PowerShell"
reference = "https://attack.mitre.org/techniques/T1059/001/"

[rule.threat.tactic]
id = "TA0002"
name = "Execution"
reference = "https://attack.mitre.org/tactics/TA0002/"
