[rule]
author = ["KZW"]
description = """ The alert triggers via sysmon data on a string that msfvenom used in their powershell reverse shell payload, out of the box. """
from = "now-10m" 
name = "MSF Venom powershell reverse shell payload observed"
risk_score = 75
severity = "high"
type = "query"
rule_id = "00000000-0000-0000-0000-000000000005"

query = '''
event.dataset: "windows.sysmon_operational" and process.command_line:"\"cmd.exe\"" and message :"*powershell -w hidden -nop -c $a=*"
'''

[rule.alert_suppression]
group_by = ["host.name"]
duration = {value = 5, unit = "m"}
missing_fields_strategy = "suppress"

[[rule.threat]] 
framework = "MITRE ATT&CK"

[[rule.threat.technique]]
id = "T1059"
name = "Command and Scripting Interpreter"
reference = "https://attack.mitre.org/techniques/T1059/"

[[rule.threat.technique.subtechnique]]
id = "T1059.001"
name = "PowerShell"
reference = "https://attack.mitre.org/techniques/T1059/001/"

[rule.threat.tactic]
id = "TA0002"
name = "Execution"
reference = "https://attack.mitre.org/tactics/TA0002/"
