[rule]
author = ["KZW"]
description = """ Using Zeek http data, we are looking at .bat file extensions on any destination port that is not 80. """
from = "now-10m" 
name = "NEQ! Example File"
risk_score = 30
severity = "low"
type = "query"
rule_id = "00000000-0000-0000-0000-000000000001"
            

query = '''
event.dataset:"zeek.http"  and url.extension : bat and not destination.port: 80
'''

[rule.alert_suppression]
group_by = ["source.ip"]
duration = {value = 5, unit = "m"}
missing_fields_strategy = "suppress"

[[rule.threat]] 
framework = "MITRE ATT&CK"

[[rule.threat.technique]]
id = "T1059"
name = "Command and Scripting Interpreter"
reference = "https://attack.mitre.org/techniques/T1059/"

[[rule.threat.technique.subtechnique]]
id = "T1059.003"
name = "Windows Command Shell"
reference = "https://attack.mitre.org/techniques/T1059/003/"

[rule.threat.tactic]
id = "TA0002"
name = "Execution"
reference = "https://attack.mitre.org/tactics/TA0002/"
