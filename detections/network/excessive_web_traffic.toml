[rule]
author = ["KZW"]
description = """ Traffic when more than 1000 queries to a web server has been observed in 5 min windows"""
from = "now-6m" 
name = "Excessive Web Traffic"
risk_score = 60
severity = "medium"
type = "threshold"
rule_id = "00000000-0000-0000-0000-000000000004"

query = '''
event.dataset:"zeek.http"
'''
[rule.threshold]
field = "source.ip" ## change the field to the field you want to use for thresholding
value = 1000 ## adjust the threshold value to your needs

[[rule.threat]] 
framework = "MITRE ATT&CK"

[[rule.threat.technique]]
id = "T1046"
name = "Network Service Discovery"
reference = "https://attack.mitre.org/techniques/T1046/"

[rule.threat.tactic]
id = "TA0007"
name = "Discovery"
reference = "https://attack.mitre.org/tactics/TA0007/"
